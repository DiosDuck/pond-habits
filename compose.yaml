# Local development stack. Start it with "make up". See docs/adr/0006-docker-only-development.md.
# Ports are bound to 127.0.0.1 only, so other machines on the network cannot connect.
name: pond-habits

x-php: &php
  image: pond-habits-php:dev
  build:
    context: ./backend
    target: dev
    args:
      UID: ${HOST_UID:-1000}
      GID: ${HOST_GID:-1000}
  working_dir: /workspace/backend
  volumes:
    - .:/workspace
  depends_on:
    db:
      condition: service_healthy
    mailpit:
      condition: service_started

services:
  api:
    <<: *php
    environment: &php-env
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: pond
      DB_USERNAME: pond
      DB_PASSWORD: pond
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"

  worker:
    <<: *php
    environment: *php-env
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=3"]

  scheduler:
    <<: *php
    environment: *php-env
    command: ["php", "artisan", "schedule:work"]

  web:
    image: pond-habits-node:dev
    build:
      context: ./frontend
      target: dev
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    working_dir: /workspace/frontend
    volumes:
      - .:/workspace
    command: ["npm", "run", "dev"]

  db:
    image: postgres:18-alpine
    environment:
      # Local only. Staging and production use secrets (ADR 0012).
      POSTGRES_DB: pond
      POSTGRES_USER: pond
      POSTGRES_PASSWORD: pond
    volumes:
      - db-data:/var/lib/postgresql
      # Runs only when the volume is new. It makes the test database.
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pond -d pond"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.34
    ports:
      - "127.0.0.1:8025:8025"

  caddy:
    image: caddy:2.11-alpine
    volumes:
      - ./infra/caddy/Caddyfile.local:/etc/caddy/Caddyfile:ro
      - ./backend:/workspace/backend:ro
      - ./frontend:/workspace/frontend:ro
      - caddy-data:/data
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8081:81"
    depends_on:
      - api
      - web

  # End-to-end tests and Lighthouse (ADR 0008, ADR 0009). Not started by "make up".
  e2e:
    image: mcr.microsoft.com/playwright:v1.65.1-noble
    profiles: ["tools"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /workspace/frontend
    volumes:
      - .:/workspace
    environment:
      HOME: /tmp
      BASE_URL: http://caddy
      CI: ${CI:-}
    ipc: host
    depends_on:
      caddy:
        condition: service_started

volumes:
  db-data:
  caddy-data:
