# Renovate (ADR 0010): dependency updates, in our own GitHub Actions. No third-party app has access.
# It uses a short-lived token from the project's own GitHub App (setup: docs/ci-bot.md).
# With the built-in GITHUB_TOKEN, the Renovate PRs would get no CI run, so they could not merge.
name: Renovate

on:
  schedule:
    - cron: "0 5 * * 1" # weekly, on Monday
  workflow_dispatch: # the owner can start it by hand (Actions tab, "Run workflow")

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  renovate:
    name: renovate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # The token is valid for 1 hour and has only these permissions.
      # "workflows" lets Renovate update the action pins in .github/workflows/.
      - name: Get a token from the GitHub App
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-workflows: write
      - uses: renovatebot/github-action@acdd6bda8b035c99ce59d5675816af2aa65a1774 # v46.3.14
        with:
          token: ${{ steps.app-token.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          # GitHub makes the commits, so they are signed and show the app as the author.
          RENOVATE_PLATFORM_COMMIT: enabled
          LOG_LEVEL: info
