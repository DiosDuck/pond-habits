# Deploy to staging (ADR 0012). It starts when the "Images" workflow is green on main,
# so the images for this commit exist on GHCR.
name: Deploy staging

on:
  workflow_run:
    workflows: [Images]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# One deploy at a time. A newer deploy waits; it does not stop a deploy that runs.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy-staging
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: staging
    permissions:
      contents: read
      # The Tailscale login uses the job's OIDC token (no stored Tailscale secret).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Join the tailnet (ephemeral, tag:ci)
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
      - name: Deploy (migrate, seed demo data, smoke test)
        run: bash infra/deploy/ci-deploy.sh staging "sha-${HEAD_SHA::7}"
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          APP_KEY: ${{ secrets.APP_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SENTRY_LARAVEL_DSN: ${{ secrets.SENTRY_LARAVEL_DSN }}

  # OWASP ZAP baseline scan of the new staging deploy (ADR 0015): passive, fails on a
  # high-risk alert. It goes through the public HTTPS address with the staging login.
  zap:
    name: zap-baseline
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: ZAP baseline scan (https://staging.pondhabits.com)
        run: make zap-baseline URL=https://staging.pondhabits.com/
        env:
          ZAP_BASIC_AUTH: ${{ secrets.STAGING_BASIC_AUTH_USER }}:${{ secrets.STAGING_BASIC_AUTH_PASSWORD }}
