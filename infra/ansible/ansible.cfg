[defaults]
# The private inventory is mounted at /inventory (make provision). It is never in the repo.
inventory = /inventory/hosts.yml
roles_path = ./roles
collections_path = /usr/share/ansible/collections
stdout_callback = default
callback_result_format = yaml
interpreter_python = auto_silent
retry_files_enabled = false

[ssh_connection]
# A known_hosts file in the private inventory folder. The first connection accepts the new key.
ssh_args = -o UserKnownHostsFile=/inventory/known_hosts -o StrictHostKeyChecking=accept-new -o ControlMaster=auto -o ControlPersist=60s
pipelining = true
