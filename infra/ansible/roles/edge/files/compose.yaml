# Edge Caddy (managed by Ansible: infra/ansible/roles/edge). Only this container publishes ports.
# It joins the edge network of each stack; the stacks cannot reach each other.
name: pond-edge

services:
  caddy:
    image: ${EDGE_CADDY_IMAGE:?}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The certificates and the ACME account. Keep this volume: a new one asks Let's Encrypt again.
      - data:/data
      - config:/config
    networks: [edge-staging, edge-production]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256m}

networks:
  edge-staging:
    external: true
  edge-production:
    external: true

volumes:
  data: {}
  config: {}
